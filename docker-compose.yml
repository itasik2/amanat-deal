services:
  postgres:
    image: postgres:16-alpine
    container_name: amanat-postgres
    environment:
      POSTGRES_USER: amanat
      POSTGRES_PASSWORD: amanat
      POSTGRES_DB: amanat_deal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    container_name: amanat-redis
    ports:
      - "6379:6379"
volumes:
  postgres-data:
